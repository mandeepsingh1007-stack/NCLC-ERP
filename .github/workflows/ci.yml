name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: Era@123
          POSTGRES_DB: nclc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore .NET packages
      run: dotnet restore Platform.sln

    - name: Build
      run: dotnet build --no-restore Platform.sln

    - name: Test (Core — Unit Tests)
      run: dotnet test tests/Platform.Tests.Core/Platform.Tests.Core.csproj --no-build --verbosity normal

    - name: Check PostgreSQL connectivity
      run: pg_isready -h localhost -p 5432
      env:
        PGPASSWORD: Era@123

    - name: Run migrations via psql
      env:
        PGPASSWORD: Era@123
      run: |
        psql -h localhost -p 5432 -U postgres -d nclc -f src/Platform.Data/Migrations/001_Create_Dictionary_Schema.sql
        psql -h localhost -p 5432 -U postgres -d nclc -f src/Platform.Data/Migrations/002_Seed_Dictionary_Data.sql

    - name: Test (Schema Contract)
      env:
        NCLC_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=nclc;Username=postgres;Password=Era@123
      run: dotnet test tests/Platform.Tests.SchemaContract/Platform.Tests.SchemaContract.csproj --no-build --verbosity normal

    - name: Test (Integration — requires PostgreSQL service)
      env:
        NCLC_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=nclc;Username=postgres;Password=Era@123
      run: |
        dotnet build tests/Platform.Tests.Integration/Platform.Tests.Integration.csproj --verbosity quiet
        dotnet test tests/Platform.Tests.Integration/Platform.Tests.Integration.csproj --no-build --logger:"console;verbosity=normal"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend

    - name: Build frontend
      run: npm run build
      working-directory: frontend
