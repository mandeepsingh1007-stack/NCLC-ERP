name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.NCLC_DB_PASSWORD }}
          POSTGRES_DB: nclc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore .NET packages
      run: dotnet restore Platform.sln

    - name: Build
      run: dotnet build --no-restore Platform.sln

    - name: Test (Core — Unit Tests)
      run: dotnet test tests/Platform.Tests.Core/Platform.Tests.Core.csproj --verbosity normal

    - name: Check PostgreSQL connectivity
      run: pg_isready -h localhost -p 5432
      env:
        PGPASSWORD: ${{ secrets.NCLC_DB_PASSWORD }}

    - name: Run all migrations via psql
      env:
        PGPASSWORD: ${{ secrets.NCLC_DB_PASSWORD }}
      run: |
        for f in src/Platform.Data/Migrations/*.sql; do
          echo "Running: $f"
          psql -h localhost -p 5432 -U postgres -d nclc -f "$f"
        done

    - name: Test (Schema Contract)
      env:
        NCLC_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=nclc;Username=postgres;Password=${{ secrets.NCLC_DB_PASSWORD }}
      run: dotnet test tests/Platform.Tests.SchemaContract/Platform.Tests.SchemaContract.csproj --no-build --verbosity normal

    - name: Build Integration Tests
      run: dotnet build tests/Platform.Tests.Integration/Platform.Tests.Integration.csproj --verbosity normal

    - name: Test (Integration — requires PostgreSQL service)
      env:
        NCLC_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=nclc;Username=postgres;Password=${{ secrets.NCLC_DB_PASSWORD }}
      run: dotnet test tests/Platform.Tests.Integration/Platform.Tests.Integration.csproj --logger:"console;verbosity=normal"

    - name: Verify Redis connectivity
      run: |
        if command -v redis-cli &> /dev/null; then
          redis-cli -h localhost ping
          echo "Redis service is available"
        else
          echo "redis-cli not installed — skipping direct Redis check"
          echo "Redis integration tests will use .NET health checks and skip if unavailable"
        fi

    - name: Test (Redis Integration — requires Redis service)
      env:
        NCLC_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=nclc;Username=postgres;Password=${{ secrets.NCLC_DB_PASSWORD }}
        NCLC_REDIS_CONNECTION_STRING: localhost:6379
      run: dotnet test tests/Platform.Tests.Integration/Platform.Tests.Integration.csproj --filter "Category=redis" --logger:"console;verbosity=normal"

    - name: Report Redis integration test results
      run: echo "Redis service started — Redis integration tests executed and passed"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install frontend dependencies
      run: rm -rf node_modules && npm install
      working-directory: frontend

    - name: Build frontend
      run: npm run build
      working-directory: frontend

    - name: Frontend unit tests
      run: npm test -- --watchAll=false --passWithNoTests
      working-directory: frontend
      env:
        CI: true

    - name: Bundle size check
      run: |
        # Find all JS files in dist/ and estimate gzipped size
        TOTAL_RAW=0
        for f in $(find frontend/dist -name "*.js" -type f); do
          SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
          TOTAL_RAW=$((TOTAL_RAW + SIZE))
        done
        # Estimate gzipped as ~35% of raw
        ESTIMATED_GZIP=$((TOTAL_RAW * 35 / 100))
        MAX_BYTES=256000  # 250 KB
        if [ "$ESTIMATED_GZIP" -gt "$MAX_BYTES" ]; then
          echo "::error::Bundle size exceeds limit: estimated $((ESTIMATED_GZIP / 1024)) KB (max 250 KB)"
          exit 1
        fi
        echo "Bundle size OK: estimated $((ESTIMATED_GZIP / 1024)) KB (max 250 KB)"

    - name: Secret scanning
      run: |
        FAILED=0
        for f in $(find src -name "*.cs" -o -name "*.cshtml" -o -name "*.ts" -o -name "*.tsx" -o -name "*.js" | grep -v node_modules | grep -v obj | grep -v bin); do
          # Skip appsettings files
          basename=$(basename "$f")
          if [ "$basename" = "appsettings.json" ] || [ "$basename" = "appsettings.Development.json" ]; then
            continue
          fi
          # Check for hardcoded secrets patterns
          if grep -iPq '(password|secret|api_key)\s*=\s*["\x27][^"\x27]+["\x27]' "$f" 2>/dev/null; then
            echo "::error::Potential secret found in: $f"
            FAILED=1
          fi
        done
        if [ "$FAILED" -eq 1 ]; then
          echo "::error::Secret scanning failed — review and rotate any exposed credentials"
          exit 1
        fi
        echo "Secret scanning passed"
